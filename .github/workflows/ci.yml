name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: hraness-cf
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      # kb:check runs in the parallel kb job below.
      - run: bun run check:code
      - name: Verify generated release files
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts
      - name: Verify every runtime export with Node
        run: node --input-type=module -e 'await Promise.all(["@hraness/analytics", "@hraness/analytics/policy", "@hraness/analytics/events", "@hraness/analytics/attribution", "@hraness/analytics/browser", "@hraness/analytics/meta", "@hraness/analytics/server", "@hraness/analytics/cli"].map((specifier) => import(specifier)))'

  kb:
    runs-on: hraness-cf
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun run kb:check

  swift:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test

  required:
    name: Required
    if: always()
    needs: [check, kb, swift]
    runs-on: hraness-cf
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          CHECK: ${{ needs.check.result }}
          KB: ${{ needs.kb.result }}
          SWIFT: ${{ needs.swift.result }}
        run: |
          set -euo pipefail
          [[ "$CHECK" == success ]]
          [[ "$KB" == success ]]
          [[ "$SWIFT" == success ]]
