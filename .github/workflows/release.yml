name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verified_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not the newest stable tag"
            exit 1
          fi
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify generated release files
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - name: Pack verified release artifact
        run: |
          set -euo pipefail
          mkdir -p release
          package_file="hraness-posthog-${GITHUB_REF_NAME#v}.tgz"
          bun pm pack --ignore-scripts --filename "release/$package_file"
          (cd release && sha256sum "$package_file" > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-package
          path: release
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_TAG" || "$VERIFIED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Publish request does not match the verified tag"
            exit 1
          fi
          package_file="hraness-posthog-${VERIFIED_TAG#v}.tgz"
          test -f "release/$package_file"
          test "$(find release -type f | wc -l)" -eq 2
          (cd release && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            "release/$package_file" release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "PostHog $GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          release_state="$(gh release view "$GITHUB_REF_NAME" \
            --json assets,isDraft,isImmutable,isPrerelease,tagName \
            --jq '[.tagName, .isDraft, .isPrerelease, .isImmutable, (.assets | length)] | @tsv')"
          expected_state="$GITHUB_REF_NAME"$'\tfalse\tfalse\ttrue\t2'
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "::error::Release $GITHUB_REF_NAME is not published and immutable"
            exit 1
          fi
          published_dir="$RUNNER_TEMP/posthog-published"
          mkdir -p "$published_dir"
          gh release download "$GITHUB_REF_NAME" --dir "$published_dir" \
            --pattern "$package_file" --pattern SHA256SUMS
          cmp release/SHA256SUMS "$published_dir/SHA256SUMS"
          (cd "$published_dir" && sha256sum --check SHA256SUMS)
